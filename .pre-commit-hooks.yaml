- id: spurhund
  name: Spurhund
  description: Spurhund scans staged commits for hardcoded secrets, credentials, and policy violations.
  entry: spurhund scan-staged
  language: python
  types: [text]
  stages: [pre-commit]
  pass_filenames: false
  always_run: true
  additional_dependencies:
    - typer>=0.9.0
    - rich>=13.0.0
    - pyyaml>=6.0
    - regex>=2023.0.0
