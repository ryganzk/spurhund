[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spurhund"
version = "0.1.0"
description = "Spurhund, a lightweight pre-commit and CI secret and policy scanner"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "regex>=2023.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
spurhund = "spurhund.cli:app"

[tool.setuptools.packages.find]
where = ["src"]